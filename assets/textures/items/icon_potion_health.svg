<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="liquidGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="60%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#6a0000"/>
    </radialGradient>
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
  </defs>
  <!-- Flask body -->
  <circle cx="32" cy="40" r="18" fill="url(#liquidGrad)" stroke="#400000" stroke-width="2"/>
  <!-- Flask neck -->
  <rect x="27" y="16" width="10" height="12" fill="#cfd8dc" opacity="0.6" stroke="#400000" stroke-width="1.5"/>
  <rect x="25" y="14" width="14" height="4" rx="2" fill="#eceff1" stroke="#400000" stroke-width="1.5"/>
  <!-- Cork -->
  <rect x="28" y="7" width="8" height="8" rx="1" fill="url(#corkGrad)" stroke="#3e2723" stroke-width="1.5"/>
  <!-- Glass shine reflection -->
  <path d="M22,30 C20,35 20,44 26,50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
