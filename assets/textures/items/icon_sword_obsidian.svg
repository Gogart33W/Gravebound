<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="obsidianBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="60%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>
  <!-- Cleaver blade -->
  <polygon points="38,6 58,16 30,54 18,42" fill="url(#obsidianBlade)" stroke="url(#goldTrim)" stroke-width="2"/>
  <polygon points="42,12 52,18 28,48 22,42" fill="#1e1e28"/>
  <line x1="48" y1="16" x2="24" y2="46" stroke="#ffb300" stroke-width="1.5"/>
  <!-- Guard -->
  <polygon points="14,36 32,54 28,58 10,40" fill="url(#goldTrim)" stroke="#b26a00" stroke-width="1.5"/>
  <!-- Grip -->
  <line x1="19" y1="49" x2="9" y2="59" stroke="#1c140e" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="7" cy="60" r="4" fill="url(#goldTrim)" stroke="#b26a00" stroke-width="1.5"/>
</svg>
